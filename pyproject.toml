[project]
name = "dl-cv-exercises"
version = "0.1.0"
description = "Deep Learning for Computer Vision Lecture Tools"
authors = [{ name = "Marco Willi", email = "marco.willi@fhnw.ch" }]
readme = "README.md"
requires-python = ">=3.12,!=3.14.1,<3.15"
dependencies = [
    # --------- data & analysis -------- #
    "pandas",
    "numpy",
    # --------- visualize -------- #
    "matplotlib",
    "seaborn",
    "plotly",
    "altair",
    # --------- data & image processing --------- #
    "pillow",
    "opencv-python-headless",
    # --------- machine learning --------- #
    "mlxtend",
    "scikit-learn",
    "scikit-image",
    "torch",
    "torchvision",
    "torchmetrics",
    "torchshow",
    "torchviz",
    "torchinfo",
    "visualtorch",
    "lightning",
    "transformers",
    "kornia",
    # --------- Hugging Face Ecosystem --------- #
    "datasets",
    "diffusers",
    "accelerate",
    "bitsandbytes",
    "sentencepiece",
    "huggingface_hub",
    "timm",
    # --- generative ai --- #
    "openai",
    "replicate",
    "google-genai",
    # --------- Experiment Tracking --------- #
    "tensorboard",
    "wandb",
    # --------- jupyter --------- #
    "jupyter",
    "jupyterlab",
    "jupyter-cache",
    "ipykernel",
    "ipywidgets",
    "xeus-python",
    "python-gitlab",
    # --------- HTTP & APIs --------- #
    "requests",
    # --------- Utilities --------- #
    "tqdm",
    "python-dotenv",
    "pyrootutils",
    "gdown",
    "tabulate",
    "peft",
    "torchaudio>=2.11.0",
]

[dependency-groups]
dev = [
    "ruff",
    "argcomplete",
    "pytest",
    "mypy",
    "pre-commit",
    "rich",
]
extra = [
    "optuna",
    "captum",
    "pyppeteer",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "E203", # whitespace before ':' (conflicts with formatter)
]

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["F401", "I", "E402", "W291", "B018", "F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
force-single-line = false
force-sort-within-sections = false
split-on-trailing-comma = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
